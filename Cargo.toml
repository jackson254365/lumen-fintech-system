[package]
name = "lumen-fintech-system"
version = "1.0.0"
edition = "2021"
authors = ["Lumen Team <alex@lumen.finance>"]
description = "Production-grade, local-first computational finance platform and cryptographic ledger engine in Rust"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["multipart"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
rust_decimal = { version = "1.36", features = ["serde-float"] }
rust_decimal_macros = "1.36"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
aes = "0.8"
cbc = "0.1"
regex = "1.10"

[[bin]]
name = "lumen-server"
path = "src/main.rs"
