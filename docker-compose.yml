version: '3.8'

services:
  lumen-fintech:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumen-fintech-system
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DB_PATH=/app/data/lumen.sqlite
      - RUST_LOG=info
    volumes:
      - lumen-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  lumen-data:
    driver: local
