<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lumen Finance</title>
  <meta name="description" content="Local-first personal finance workspace" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand"><span class="brand-mark"><i data-lucide="sparkles"></i></span><span>Lumen</span></div>
      <div class="workspace-switcher"><span class="workspace-avatar">AM</span><span><strong>Alex Morgan</strong><small>Personal workspace</small></span><i data-lucide="chevrons-up-down"></i></div>
      <nav class="nav" id="nav">
        <button class="active" type="button" data-view="overview"><i data-lucide="layout-dashboard"></i><span>Overview</span></button>
        <button type="button" data-view="accounts"><i data-lucide="wallet-cards"></i><span>Accounts</span></button>
        <button type="button" data-view="budgets"><i data-lucide="target"></i><span>Budgets</span></button>
        <button type="button" data-view="activity"><i data-lucide="arrow-left-right"></i><span>Activity</span></button>
        <button type="button" data-view="rails"><i data-lucide="globe"></i><span>Payment Rails</span></button>
        <button type="button" data-view="statements"><i data-lucide="file-spreadsheet"></i><span>Statement Import</span></button>
        <button type="button" data-view="research"><i data-lucide="sparkles"></i><span>Research Hub</span></button>
        <button type="button" data-view="ledger"><i data-lucide="shield-check"></i><span>Audit Ledger</span></button>
        <button type="button" data-view="settings"><i data-lucide="settings-2"></i><span>Settings</span></button>
      </nav>
      <div class="sidebar-foot"><button class="sidebar-link" id="exportButton" type="button"><i data-lucide="download"></i><span>Export ledger</span></button><button class="sidebar-link" id="resetButton" type="button"><i data-lucide="rotate-ccw"></i><span>Reset demo data</span></button></div>
    </aside>

    <main class="main">
      <header class="topbar"><div class="breadcrumb"><span>Workspace</span><i data-lucide="chevron-right"></i><strong id="breadcrumbCurrent">Overview</strong></div><div class="top-actions"><span id="connectionBadge" class="badge-pill success"><i data-lucide="check-circle-2" style="width:13px;height:13px"></i> Ledger Online</span><button class="icon-button mobile-menu" id="menuButton" type="button" aria-label="Open navigation"><i data-lucide="menu"></i></button><button class="icon-button" id="notificationButton" type="button" aria-label="Notifications"><i data-lucide="bell"></i><span class="notification-dot"></span></button><span class="workspace-avatar" id="topbarAvatar">AM</span></div></header>
      <div id="app" class="page" aria-live="polite"></div>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">Add money</h2><button class="modal-close" id="modalClose" type="button" aria-label="Close dialog"><i data-lucide="x"></i></button></div><div id="modalBody"></div></section></div>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
